[package]
name = "rust-ds-lab"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Native Rust data structure and algorithm learning desktop"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
